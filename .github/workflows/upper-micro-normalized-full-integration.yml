# RESEARCH EXPERIMENT: generated micro-shrunk Upper candidate, not previously proven.
# Inputs: pinned upstream commit and three experimental scripts in harness commit.
# No source or theorem is weakened; derived certificate normalization is audited.
# Actual Lean PASS requires all four jobs AND final to succeed.
name: Upper normalized micro candidate full integration (experimental)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shards:
    name: Verify normalized micro shard group ${{ matrix.group }}
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    defaults:
      run:
        working-directory: upstream
    strategy:
      fail-fast: false
      matrix:
        group: [0, 1, 2, 3]
    steps:
      - name: Check out experimental harness at workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      - name: Check out immutable original upstream
        uses: actions/checkout@v4
        with:
          ref: 9a3394130fe4f7b1df6ffdeffda16601795d9ce4
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Derive, normalize, and audit candidate (no theorem claim)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '9a3394130fe4f7b1df6ffdeffda16601795d9ce4'
          test "$(git -C ../harness rev-parse HEAD)" = "$GITHUB_SHA"
          python3 ../harness/.github/scripts/derive_micro_candidate.py \
            --root . --report micro-derived-input-report.json > derive.log 2>&1
          python3 ../harness/.github/scripts/normalize_derived_multipliers.py \
            --root . --derive-report micro-derived-input-report.json \
            --report micro-normalization-report.json \
            --csv micro-normalization-per-leaf.csv > normalize.log 2>&1
          python3 ../harness/.github/scripts/validate_derived_candidate.py \
            --root . --skip-export --report micro-numeric-preflight.json > numeric.log 2>&1
          python3 - <<'PY_CHECK'
          import json,sys
          from pathlib import Path
          sys.path[:0]=[str(Path('scripts').resolve()),str(Path('scripts/upper').resolve())]
          from common import source_snapshot
          from exact import inputs
          d=json.loads(Path('micro-derived-input-report.json').read_text())
          n=json.loads(Path('micro-normalization-report.json').read_text())
          q=json.loads(Path('micro-numeric-preflight.json').read_text())
          assert d['delta2']==d['delta3']=='1/30000000'
          assert n['upstream_commit']==d['upstream_commit']=='9a3394130fe4f7b1df6ffdeffda16601795d9ce4'
          assert n['number_of_leaves']==12663 and n['normalized_all_LB_equal_1'] is True
          assert n['number_of_raw_LB_below_1']==12663
          assert q['number_of_leaves']==12663 and q['numerically_failed_leaves']==0
          assert source_snapshot()['sha256']==n['derived_source_fingerprint']==q['source_fingerprint']
          assert inputs(Path('certificates/upper'))[0]['sha256']==n['normalized_certificate_fingerprint']==q['certificate_fingerprint']
          assert n['original_derived_certificate_fingerprint']==d['derived_certificate_fingerprint']
          print('NORMALIZED_DERIVED_INPUTS_AND_12663_LEAVES_PASS; NOT_A_LEAN_PROOF',flush=True)
          PY_CHECK
      - name: Set up pinned Lean and mathlib
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 9a3394130fe4f7b1df6ffdeffda16601795d9ce4
          test "$(git -C ../harness rev-parse HEAD)" = "$GITHUB_SHA"
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install leanprover/lean4:v4.33.1
          lake exe cache get > mathlib-cache.log 2>&1
      - name: Export and verify assigned shards, preserving olean files
        shell: bash
        env:
          GROUP: ${{ matrix.group }}
          LEAN_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee shard-progress.log
          import sys,os,json,hashlib,subprocess,time
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts').resolve()))
          sys.path.insert(0,str(Path('scripts/upper').resolve()))
          from common import ROOT,source_snapshot
          from exact import inputs
          from export import export,SHARD_SIZE
          group=int(os.environ['GROUP']); assert group in range(4)
          src=source_snapshot(); cert=ROOT/'certificates/upper'
          inp,h,_=inputs(cert); assert h['complete'] is True
          out=ROOT/'MoserWorm/UpperBound/Certificate/Generated'
          m=export(cert,out)
          assert m['complete'] is True and m['inputs']==inp and m['shard_size']==SHARD_SIZE
          assert m['shards']==1583 and len(m['modules'])==1636
          ns='MoserWorm.UpperBound.Certificate.Generated.Shard'
          names=[ns+str(i) for i in range(1583) if i%4==group]
          actual={x['name'] for x in m['modules']}
          assert set(names)<=actual
          base=ROOT/'.lake/build/lib/lean/MoserWorm/UpperBound/Certificate/Generated'
          base.mkdir(parents=True,exist_ok=True)
          norm=json.loads(Path('micro-normalization-report.json').read_text())
          num=json.loads(Path('micro-numeric-preflight.json').read_text())
          derived=json.loads(Path('micro-derived-input-report.json').read_text())
          assert src['sha256']==norm['derived_source_fingerprint']==num['source_fingerprint']
          assert inp['sha256']==norm['normalized_certificate_fingerprint']==num['certificate_fingerprint']
          assert derived['delta2']==derived['delta3']=='1/30000000'
          rec={'group':group,'source':src['sha256'],'inputs':inp['sha256'],
               'manifest':hashlib.sha256((out/'manifest.json').read_bytes()).hexdigest(),
               'commit':'9a3394130fe4f7b1df6ffdeffda16601795d9ce4',
               'harness_commit':os.environ['GITHUB_SHA'],
               'delta2':derived['delta2'],'delta3':derived['delta3'],
               'exact_area':derived['exact_area'],
               'normalized_all_LB_equal_1':norm['normalized_all_LB_equal_1'],
               'number_of_leaves':num['number_of_leaves'],
               'expected':names,'verified':[],'hashes':{},'complete':False}
          dest=Path('group-record.json')
          def save():dest.write_text(json.dumps(rec,sort_keys=True,indent=2)+'\n')
          save()
          # Build common prerequisites once, then compile assigned shards directly.
          subprocess.run(['lake','build','MoserWorm.UpperBound.Certificate.Kernel.Header'],check=True,
                         stdout=open('shared-build.log','w'),stderr=subprocess.STDOUT)
          for mod in ('Data','Tries'):
              subprocess.run(['lake','env','lean','-o',str(base/(mod+'.olean')),str(out/(mod+'.lean'))],check=True,
                             stdout=open('common-direct.log','a'),stderr=subprocess.STDOUT)
          for j,name in enumerate(names,1):
              short=name.rsplit('.',1)[-1]; output=base/(short+'.olean')
              print('BEGIN_SHARD',short,flush=True)
              with open('last-shard.log','w') as log:
                  subprocess.run(['lake','env','lean','-o',str(output),str(out/(short+'.lean'))],
                                 stdout=log,stderr=subprocess.STDOUT,check=True)
              assert output.is_file() and output.stat().st_size>0
              rec['hashes'][short]=hashlib.sha256(output.read_bytes()).hexdigest()
              rec['verified'].append(name)
              if j%10==0 or j==len(names):
                  save(); print('GROUP',group,j,'/',len(names),flush=True)
          assert source_snapshot()==src and inputs(cert)[0]==inp
          rec['complete']=True; save()
          print('GROUP_OLEAN_PASS',group,len(names),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: micro-normalized-shard-oleans-${{ matrix.group }}
          path: |
            upstream/.lake/build/lib/lean/MoserWorm/UpperBound/Certificate/Generated/Shard*.olean
            upstream/group-record.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: micro-normalized-shard-logs-${{ matrix.group }}
          path: |
            upstream/shard-progress.log
            upstream/shared-build.log
            upstream/common-direct.log
            upstream/last-shard.log
            upstream/derive.log
            upstream/normalize.log
            upstream/numeric.log
            upstream/micro-derived-input-report.json
            upstream/micro-normalization-report.json
            upstream/micro-numeric-preflight.json
          if-no-files-found: warn
          retention-days: 14
  final:
    name: Audit normalized shards and compile Upper Main
    needs: shards
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    defaults:
      run:
        working-directory: upstream
    steps:
      - name: Check out experimental harness at workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: harness
          persist-credentials: false
      - name: Check out immutable original upstream
        uses: actions/checkout@v4
        with:
          ref: 9a3394130fe4f7b1df6ffdeffda16601795d9ce4
          path: upstream
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Derive, normalize, and audit candidate (no theorem claim)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '9a3394130fe4f7b1df6ffdeffda16601795d9ce4'
          test "$(git -C ../harness rev-parse HEAD)" = "$GITHUB_SHA"
          python3 ../harness/.github/scripts/derive_micro_candidate.py \
            --root . --report micro-derived-input-report.json > derive.log 2>&1
          python3 ../harness/.github/scripts/normalize_derived_multipliers.py \
            --root . --derive-report micro-derived-input-report.json \
            --report micro-normalization-report.json \
            --csv micro-normalization-per-leaf.csv > normalize.log 2>&1
          python3 ../harness/.github/scripts/validate_derived_candidate.py \
            --root . --skip-export --report micro-numeric-preflight.json > numeric.log 2>&1
          python3 - <<'PY_CHECK'
          import json,sys
          from pathlib import Path
          sys.path[:0]=[str(Path('scripts').resolve()),str(Path('scripts/upper').resolve())]
          from common import source_snapshot
          from exact import inputs
          d=json.loads(Path('micro-derived-input-report.json').read_text())
          n=json.loads(Path('micro-normalization-report.json').read_text())
          q=json.loads(Path('micro-numeric-preflight.json').read_text())
          assert d['delta2']==d['delta3']=='1/30000000'
          assert n['upstream_commit']==d['upstream_commit']=='9a3394130fe4f7b1df6ffdeffda16601795d9ce4'
          assert n['number_of_leaves']==12663 and n['normalized_all_LB_equal_1'] is True
          assert n['number_of_raw_LB_below_1']==12663
          assert q['number_of_leaves']==12663 and q['numerically_failed_leaves']==0
          assert source_snapshot()['sha256']==n['derived_source_fingerprint']==q['source_fingerprint']
          assert inputs(Path('certificates/upper'))[0]['sha256']==n['normalized_certificate_fingerprint']==q['certificate_fingerprint']
          assert n['original_derived_certificate_fingerprint']==d['derived_certificate_fingerprint']
          print('NORMALIZED_DERIVED_INPUTS_AND_12663_LEAVES_PASS; NOT_A_LEAN_PROOF',flush=True)
          PY_CHECK
      - name: Set up pinned Lean and mathlib
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 9a3394130fe4f7b1df6ffdeffda16601795d9ce4
          test "$(git -C ../harness rev-parse HEAD)" = "$GITHUB_SHA"
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install leanprover/lean4:v4.33.1
          lake exe cache get > mathlib-cache.log 2>&1
      - name: Re-export sources and build shared soundness dependencies
        shell: bash
        env:
          LEAN_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts').resolve()))
          sys.path.insert(0,str(Path('scripts/upper').resolve()))
          from common import ROOT
          from exact import inputs
          from export import export,SHARD_SIZE
          c=ROOT/'certificates/upper'; inp,h,_=inputs(c)
          assert h['complete'] is True
          m=export(c,ROOT/'MoserWorm/UpperBound/Certificate/Generated')
          assert m['complete'] is True and m['inputs']==inp and m['shard_size']==SHARD_SIZE
          assert m['shards']==1583 and len(m['modules'])==1636
          PY
          lake build MoserWorm.UpperBound.Certificate.Kernel.Header MoserWorm.UpperBound.Certificate.Extraction MoserWorm.UpperBound.Certificate.GeometricSound > soundness-build.log 2>&1
      - uses: actions/download-artifact@v4
        with:
          pattern: micro-normalized-shard-oleans-*
          path: upstream/received
          merge-multiple: false
      - name: Audit all 1583 transferred olean files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee transfer-audit.log
          import json,hashlib,shutil,sys
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts').resolve()))
          sys.path.insert(0,str(Path('scripts/upper').resolve()))
          from common import ROOT,source_snapshot
          from exact import inputs
          base=ROOT/'.lake/build/lib/lean/MoserWorm/UpperBound/Certificate/Generated'
          base.mkdir(parents=True,exist_ok=True)
          out=ROOT/'MoserWorm/UpperBound/Certificate/Generated'
          source=source_snapshot()['sha256']; inp=inputs(ROOT/'certificates/upper')[0]['sha256']
          manifest=hashlib.sha256((out/'manifest.json').read_bytes()).hexdigest()
          all_names=[]
          for g in range(4):
              folder=Path(f'received/micro-normalized-shard-oleans-{g}')
              rec=json.loads((folder/'group-record.json').read_text())
              assert rec['complete'] and rec['group']==g
              assert (rec['source'],rec['inputs'],rec['manifest'])==(source,inp,manifest)
              assert rec['commit']=='9a3394130fe4f7b1df6ffdeffda16601795d9ce4'
              assert rec['harness_commit']==__import__('os').environ['GITHUB_SHA']
              assert rec['delta2']==rec['delta3']=='1/30000000'
              assert rec['normalized_all_LB_equal_1'] is True and rec['number_of_leaves']==12663
              assert rec['exact_area']==json.loads(Path('micro-derived-input-report.json').read_text())['exact_area']
              expected=['MoserWorm.UpperBound.Certificate.Generated.Shard'+str(i) for i in range(1583) if i%4==g]
              assert rec['expected']==rec['verified']==expected
              assert set(rec['hashes'])=={'Shard'+str(i) for i in range(1583) if i%4==g}
              for name,sha in rec['hashes'].items():
                  src=folder/'.lake/build/lib/lean/MoserWorm/UpperBound/Certificate/Generated'/(name+'.olean')
                  assert src.is_file(),f'missing {src}'
                  assert hashlib.sha256(src.read_bytes()).hexdigest()==sha,f'hash mismatch {name}'
                  assert not (base/(name+'.olean')).exists(),f'duplicate {name}'
                  shutil.copy2(src,base/(name+'.olean'))
                  all_names.append(name)
              print('TRANSFER GROUP PASS',g,len(rec['hashes']),flush=True)
          assert set(all_names)=={'Shard'+str(i) for i in range(1583)} and len(all_names)==1583
          Path('transfer-audit.json').write_text(json.dumps({
              'source':source,'inputs':inp,'manifest':manifest,
              'harness_commit':__import__('os').environ['GITHUB_SHA'],
              'upstream_commit':'9a3394130fe4f7b1df6ffdeffda16601795d9ce4',
              'delta2':'1/30000000','delta3':'1/30000000',
              'exact_area':json.loads(Path('micro-derived-input-report.json').read_text())['exact_area'],
              'shards':1583,'verified':True},indent=2))
          print('DERIVED_NORMALIZED_ALL_1583_OLEAN_TRANSFER_PASS',flush=True)
          PY
      - name: Compile remaining generated modules and final Main with direct Lean
        shell: bash
        env:
          LEAN_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee final-progress.log
          import json,subprocess,sys,time
          from pathlib import Path
          sys.path.insert(0,str(Path('scripts').resolve()))
          sys.path.insert(0,str(Path('scripts/upper').resolve()))
          from common import ROOT,source_snapshot
          from exact import inputs
          from graphlib import TopologicalSorter
          out=ROOT/'MoserWorm/UpperBound/Certificate/Generated'
          m=json.loads((out/'manifest.json').read_text())
          source_before=source_snapshot(); input_before=inputs(ROOT/'certificates/upper')[0]
          graph={x['name']:set(x['dependencies']) for x in m['modules']}
          order=list(TopologicalSorter(graph).static_order())
          base=ROOT/'.lake/build/lib/lean/MoserWorm/UpperBound/Certificate/Generated'
          def compile(path,output,label):
              print('BEGIN',label,flush=True)
              start=time.monotonic()
              with open('last-final-lean.log','w') as log:
                  subprocess.run(['lake','env','lean','-o',str(output),str(path)],check=True,
                                 stdout=log,stderr=subprocess.STDOUT)
              assert output.is_file() and output.stat().st_size>0
              print('PASS',label,'seconds',round(time.monotonic()-start,2),flush=True)
          for name in order:
              short=name.rsplit('.',1)[-1]
              if short.startswith('Shard') and short[5:].isdigit():
                  assert (base/(short+'.olean')).is_file()
                  continue
              compile(out/(short+'.lean'),base/(short+'.olean'),short)
          # Main imports Assembly, Common.Audit and GeometricSound.
          # Build Common.Audit explicitly without asking Lake to build Assembly.
          subprocess.run(['lake','build','MoserWorm.Common.Audit'],check=True,
                         stdout=open('audit-deps.log','w'),stderr=subprocess.STDOUT)
          main=ROOT/'MoserWorm/UpperBound/Main.lean'
          source_text=main.read_text()
          assert 'audit_axioms MoserWorm.upper_bound MoserWorm.optimalArea_upper_bound' in source_text
          assert 'theorem upper_bound' in source_text and 'theorem optimalArea_upper_bound' in source_text
          main_output=ROOT/'.lake/build/lib/lean/MoserWorm/UpperBound/Main.olean'
          compile(main,main_output,'Main')
          assert source_snapshot()==source_before and inputs(ROOT/'certificates/upper')[0]==input_before
          import hashlib,os
          def sha(path):return hashlib.sha256(Path(path).read_bytes()).hexdigest()
          other_names=[name for name in order if not (name.rsplit('.',1)[-1].startswith('Shard') and name.rsplit('.',1)[-1][5:].isdigit())]
          assert len(other_names)==53 and all((base/(n.rsplit('.',1)[-1]+'.olean')).is_file() for n in other_names)
          evidence={'status':'DERIVED_NORMALIZED_UPPER_MAIN_DIRECT_LEAN_PASS',
              'full_original_verify_py_executed':False,
              'upstream_commit':'9a3394130fe4f7b1df6ffdeffda16601795d9ce4',
              'harness_commit':os.environ['GITHUB_SHA'],
              'derived_source_fingerprint':source_before['sha256'],
              'normalized_certificate_fingerprint':input_before['sha256'],
              'manifest_sha256':sha(out/'manifest.json'),
              'main_olean_sha256':sha(main_output),
              'other_53_olean_sha256':{n:sha(base/(n.rsplit('.',1)[-1]+'.olean')) for n in other_names}}
          Path('final-evidence.json').write_text(json.dumps(evidence,indent=2,sort_keys=True)+'\n')
          print('DERIVED_NORMALIZED_UPPER_MAIN_LEAN_AND_AXIOM_AUDIT_PASS; UPSTREAM_VERIFY_PY_NOT_RUN',flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: micro-normalized-final-integration-logs
          path: |
            upstream/mathlib-cache.log
            upstream/soundness-build.log
            upstream/transfer-audit.log
            upstream/transfer-audit.json
            upstream/final-progress.log
            upstream/last-final-lean.log
            upstream/audit-deps.log
            upstream/derive.log
            upstream/normalize.log
            upstream/numeric.log
            upstream/micro-derived-input-report.json
            upstream/micro-normalization-report.json
            upstream/micro-numeric-preflight.json
            upstream/final-evidence.json
            upstream/.lake/build/lib/lean/MoserWorm/UpperBound/Main.olean
            upstream/.lake/build/lib/lean/MoserWorm/UpperBound/Certificate/Generated/Tree.olean
            upstream/.lake/build/lib/lean/MoserWorm/UpperBound/Certificate/Generated/Assembly.olean
            upstream/MoserWorm/UpperBound/Certificate/Generated/manifest.json
          if-no-files-found: warn
          retention-days: 14
