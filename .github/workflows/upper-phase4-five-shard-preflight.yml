# EXPERIMENTAL: delta2=delta3=1/10000000. This is NOT a full proof.
# Original upstream and previously proven micro artifacts are not modified.
name: Phase 4 adjustable-multipliers five-shard Lean preflight (NOT full proof)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  five-shard-preflight:
    name: Reconstruct Phase 4 and check five critical shards
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: upstream
    steps:
      - name: Check out Phase 4 experimental files at current workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: research
          persist-credentials: false
      - name: Check out immutable successful micro proof harness
        uses: actions/checkout@v4
        with:
          ref: 568c2f0ac41c60ff98c56b9da54aea9c56899bfc
          path: harness
          persist-credentials: false
      - name: Check out immutable original upstream
        uses: actions/checkout@v4
        with:
          ref: 9a3394130fe4f7b1df6ffdeffda16601795d9ce4
          path: upstream
          persist-credentials: false
      - name: Install Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Rebuild verified micro inputs and derive Phase 4 exact inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '9a3394130fe4f7b1df6ffdeffda16601795d9ce4'
          test "$(git -C ../harness rev-parse HEAD)" = '568c2f0ac41c60ff98c56b9da54aea9c56899bfc'
          test "$(git -C ../research rev-parse HEAD)" = "$GITHUB_SHA"
          test -f ../research/.github/scripts/derive_phase4_from_normalized_micro.py
          test -f ../research/.github/phase4/phase4_five_normalized_certificates.json
          python3 ../harness/.github/scripts/derive_micro_candidate.py \
            --root . --report micro-derived-input-report.json > phase4-micro-derive.log 2>&1
          python3 ../harness/.github/scripts/normalize_derived_multipliers.py \
            --root . --derive-report micro-derived-input-report.json \
            --report micro-normalization-report.json \
            --csv micro-normalization-per-leaf.csv > phase4-micro-normalize.log 2>&1
          python3 ../research/.github/scripts/derive_phase4_from_normalized_micro.py \
            --root . --witnesses ../research/.github/phase4/phase4_five_normalized_certificates.json \
            --report phase4-derived-report.json 2>&1 | tee phase4-derive.log
      - name: Verify exact fingerprint, delta, area, and certificate count
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee phase4-input-audit.log
          import json,sys
          from pathlib import Path
          sys.path[:0]=[str(Path('scripts').resolve()),str(Path('scripts/upper').resolve())]
          from common import source_snapshot
          from exact import inputs,H
          from fractions import Fraction as Q
          r=json.loads(Path('phase4-derived-report.json').read_text())
          assert r['status']=='PHASE4_EXACT_DERIVED_INPUTS_NOT_LEAN_PROOF'
          assert r['delta2']==r['delta3']=='1/10000000'
          assert r['area_exact']=='13146096881486542786561993/53367364863120000000000000'
          assert r['leaves']==12663 and r['all_LB_equal_1'] is True
          assert r['reoptimized_leaves']==[2056,4093,7875,9312,11786]
          src=source_snapshot()['sha256']
          cert,header,m=inputs(Path('certificates/upper'))
          assert src==r['source_fingerprint']=='24369c3b0e4ce582a64a28891d923de11cbad91ee7603064c4ea6186d4a897a8'
          assert cert['sha256']==r['certificate_fingerprint']=='c2650647317eaee181d53e447acd3e0f5f86f39a48d1f07fd40c6d6b800de594'
          assert header['complete'] is True and header['leaves']==12663
          assert H==[Q(0),Q(0),Q('130783/250000')-Q(1,10000000),Q('446199/1000000')-Q(1,10000000)]
          print('PHASE4_DERIVED_SOURCE_CERTIFICATE_FINGERPRINT_PASS',flush=True)
          PY
      - name: Install pinned Lean 4.33.1 and mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install leanprover/lean4:v4.33.1
          lean --version
          lake exe cache get > phase4-mathlib-cache.log 2>&1
      - name: Kernel-check changed Shape and GeometricSound
        shell: bash
        env:
          LEAN_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          lake build MoserWorm.UpperBound.Shape \
            MoserWorm.UpperBound.Certificate.GeometricSound \
            2>&1 | tee phase4-soundness.log
          echo PHASE4_SHAPE_AND_SOUNDNESS_LEAN_PASS_NOT_FULL_PROOF
      - name: Export 1636 generated Lean sources and audit manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' 2>&1 | tee phase4-export.log
          import sys,hashlib
          from pathlib import Path
          sys.path[:0]=[str(Path('scripts').resolve()),str(Path('scripts/upper').resolve())]
          from exact import inputs
          from export import export,SHARD_SIZE
          cert=Path('certificates/upper')
          before,h,m=inputs(cert)
          out=Path('MoserWorm/UpperBound/Certificate/Generated')
          manifest=export(cert,out)
          assert manifest['complete'] is True and manifest['inputs']==before
          assert manifest['shard_size']==SHARD_SIZE==8
          assert manifest['shards']==1583 and len(manifest['modules'])==1636
          digest=hashlib.sha256((out/'manifest.json').read_bytes()).hexdigest()
          assert digest=='9c727d3685b9ec6ad38c648ada609251ebf7df2c3bdb6bbb155342a2026218bf',digest
          for i in (257,511,984,1164,1473):
              assert (out/('Shard'+str(i)+'.lean')).is_file()
          print('PHASE4_GENERATED_1636_MODULES_MANIFEST_PASS',digest,flush=True)
          PY
      - name: Kernel-check five affected shards
        shell: bash
        env:
          LEAN_NUM_THREADS: '2'
        run: |
          set -euo pipefail
          lake build \
            MoserWorm.UpperBound.Certificate.Generated.Shard257 \
            MoserWorm.UpperBound.Certificate.Generated.Shard511 \
            MoserWorm.UpperBound.Certificate.Generated.Shard984 \
            MoserWorm.UpperBound.Certificate.Generated.Shard1164 \
            MoserWorm.UpperBound.Certificate.Generated.Shard1473 \
            2>&1 | tee phase4-five-shards-lean.log
          echo PHASE4_FIVE_REOPTIMIZED_LEAVES_KERNEL_CHECK_PASS_NOT_FULL_PROOF
      - name: Verify source and certificate unchanged during the Lean test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path[:0]=[str(Path('scripts').resolve()),str(Path('scripts/upper').resolve())]
          from common import source_snapshot
          from exact import inputs
          r=json.loads(Path('phase4-derived-report.json').read_text())
          assert source_snapshot()['sha256']==r['source_fingerprint']
          assert inputs(Path('certificates/upper'))[0]['sha256']==r['certificate_fingerprint']
          print('PHASE4_INPUTS_UNCHANGED_AFTER_LEAN_TEST_PASS')
          PY
      - name: Save all experiment diagnostics, including on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-five-shard-preflight-logs
          path: |
            upstream/phase4-*.log
            upstream/phase4-derived-report.json
            upstream/micro-derived-input-report.json
            upstream/micro-normalization-report.json
          if-no-files-found: warn
          retention-days: 21
